<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41431b"/>
      <stop offset="0.55" stop-color="#363818"/>
      <stop offset="1" stop-color="#2c2e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#aeb784" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#aeb784" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- needle accent (alude a la aguja ecoguiada) -->
  <line x1="1052" y1="36" x2="884" y2="566" stroke="#aeb784" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>

  <!-- monograma MP -->
  <g transform="translate(992,66) scale(0.30)">
    <text x="178" y="300" font-family="Georgia, serif" font-weight="700" font-size="300" fill="#f8f3e1" text-anchor="middle">M</text>
    <text x="320" y="420" font-family="Georgia, serif" font-weight="700" font-size="300" fill="#f8f3e1" text-anchor="middle">P</text>
    <line x1="420" y1="70" x2="150" y2="450" stroke="#aeb784" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="206" font-family="Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="4" fill="#aeb784">MP STUDIO · MENDOZA, ARGENTINA</text>

  <!-- titulo -->
  <text x="78" y="302" font-family="Georgia, serif" font-weight="700" font-size="70" fill="#ffffff">Electrólisis Percutánea</text>
  <text x="78" y="384" font-family="Georgia, serif" font-weight="700" font-size="70" fill="#ffffff">Intratisular <tspan fill="#c7cdab">en Mendoza</tspan></text>

  <!-- barra acento -->
  <rect x="82" y="416" width="92" height="6" rx="3" fill="#aeb784"/>

  <!-- subtitulo -->
  <text x="80" y="478" font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#e3dbbb">Fisioterapia invasiva ecoguiada · EPI en Mendoza</text>

  <!-- linea inferior -->
  <text x="80" y="556" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#aeb784" fill-opacity="0.9">Tendinopatías · Lesiones deportivas · Dolor crónico · Evaluación ecográfica</text>
</svg>
